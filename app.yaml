id: contracts
name: Contracts
version: 0.3.0
publisher: cbferrum
summary: "Contracts from types and approved clauses, their body generated and kept by version, approval by policy, signature through Sign to any signatories, renewal, notice, obligations and reminders"
description: README.md
categories: [productivity, sales]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-contracts
support: https://github.com/CBFerrum/ferrum-app-contracts/issues
runtime: native
platform: ">=0.3.2, <0.4"
# Contracts are signed through Sign: installing it installs Sign.
requires: {sign: ">=0.1"}
packages: [contracts]
uninstall: ask
# Its own interface at /contracts/: contracts by stage, renewals coming and obligations due.
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: contracts
      route: contracts
      title: Contracts
      description: Contracts, clauses, renewals and obligations
      icon: file-text
      color: "#334155"
      roles: [Contract Manager, Contract Approver]
  shell.open:
    - {id: contracts, package: contracts, path: "contracts/e/{entity}/{id}", list: "contracts/e/{entity}"}
  shell.create:
    - {id: contract, label: Contract, path: contracts/e/Contract/new, entity: Contract}
  # What the assistant should know in Contracts's pages, and what it suggests asking there.
  shell.assistant:
    - id: contracts
      title: "Contracts"
      instructions: >-
        A Contract goes Draft, In Review, Approved, Out for Signature, Signed, then Active until it Expires or is
        Terminated; submitting it asks the approval policy (Contract Approval), which at the workspace's threshold or
        more asks a Contract Approver. A Contract Type names the document template its body is made from; each
        submit keeps the body as a version (versions). Its clauses come from the approved library (Clause,
        ContractClause), its signatories sign in order, and one signed elsewhere is marked signed_elsewhere. A
        confidential contract is read by its owner, its readers and Legal. An Obligation (Open, Done; an obligation
        or a milestone) is something either side must do, by its date. Renewal and notice dates are on the
        contract.
      suggestions:
        - "Which contracts expire in the next 90 days?"
        - "Which obligations are due this month?"
        - "What is waiting for approval or signature?"
